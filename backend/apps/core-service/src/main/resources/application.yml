spring:
  application:
    name: core-service
  datasource:
    url: ${CORE_DB_URL:jdbc:postgresql://core-db:5432/core-db}
    username: ${CORE_DB_USER:core}
    password: ${CORE_DB_PASSWORD:core-dev-password}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

fraud:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_FRAUD_MODEL:gpt-5.4-mini}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:5}

services:
  pay:
    base-url: ${PAY_SERVICE_URL:http://pay-service:8080}
  merchant:
    base-url: ${MERCHANT_SERVICE_URL:http://ucp-merchant-mock:8080}
