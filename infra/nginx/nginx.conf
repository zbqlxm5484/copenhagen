events {}

http {
  server_tokens off;

  upstream core_service {
    server core-service:8080;
  }

  upstream mcp_server {
    server mcp-server:8080;
  }

  upstream pay_service {
    server pay-service:8080;
  }

  server {
    listen 80;

    location = /internal {
      return 404;
    }

    location ^~ /internal/ {
      return 404;
    }

    location = /.well-known/ucp {
      proxy_pass http://core_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
      proxy_pass http://mcp_server;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/core/ {
      proxy_pass http://core_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/pay/ {
      proxy_pass http://pay_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /merchant/v1/ {
      proxy_pass http://pay_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 404;
    }
  }
}
