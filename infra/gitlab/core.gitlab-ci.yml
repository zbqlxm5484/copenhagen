.core-verify-rules:
  rules:
    - if: >-
        ($CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop") ||
        ($CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BRANCH == "develop")
      changes:
        - backend/apps/core-service/**/*
        - backend/libs/ucp-contract/**/*
        - backend/libs/internal-api-contract/**/*
        - backend/libs/test-support/**/*
        - backend/build.gradle
        - backend/settings.gradle
        - backend/gradle/**/*
        - backend/gradlew
        - backend/gradlew.bat
        - .gitlab-ci.yml
        - docker-compose.yml
        - scripts/deploy-dev-service.sh
        - infra/gitlab/common.gitlab-ci.yml
        - infra/gitlab/core.gitlab-ci.yml
    - when: never

.core-delivery-rules:
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BRANCH == "develop"
      changes:
        - backend/apps/core-service/**/*
        - backend/libs/ucp-contract/**/*
        - backend/libs/internal-api-contract/**/*
        - backend/libs/test-support/**/*
        - backend/build.gradle
        - backend/settings.gradle
        - backend/gradle/**/*
        - backend/gradlew
        - backend/gradlew.bat
        - .gitlab-ci.yml
        - docker-compose.yml
        - scripts/deploy-dev-service.sh
        - infra/gitlab/common.gitlab-ci.yml
        - infra/gitlab/core.gitlab-ci.yml
    - when: never

core-test:
  extends:
    - .gradle-job
    - .core-verify-rules
  stage: test
  variables:
    GRADLE_TASK: :apps:core-service:test

core-build:
  extends:
    - .gradle-job
    - .core-verify-rules
  stage: build
  needs:
    - core-test
  variables:
    GRADLE_TASK: :apps:core-service:bootJar
  artifacts:
    paths:
      - backend/apps/core-service/build/libs/app.jar
    expire_in: 1 day

core-docker-build:
  extends:
    - .docker-build-job
    - .core-delivery-rules
  stage: docker-build
  needs:
    - job: core-build
      artifacts: false
  variables:
    DOCKERFILE: backend/apps/core-service/Dockerfile
    CONTAINER_IMAGE: copenhagen/core-service:$CI_COMMIT_SHA
    IMAGE_ARCHIVE: docker-images/core-service.tar.gz

core-deploy-dev:
  extends:
    - .deploy-dev-job
    - .core-delivery-rules
  stage: deploy-dev
  needs:
    - job: core-docker-build
      artifacts: true
  resource_group: development-ec2
  variables:
    COMPOSE_SERVICE: core-service
    DEPLOY_IMAGE_VARIABLE: CORE_IMAGE
    CONTAINER_IMAGE: copenhagen/core-service:$CI_COMMIT_SHA
    IMAGE_ARCHIVE: docker-images/core-service.tar.gz
