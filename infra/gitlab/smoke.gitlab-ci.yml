deploy-smoke:
  image: docker:28-cli
  stage: deploy-smoke
  services:
    - name: docker:28-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GIT_DEPTH: "0"
  dependencies: []
  before_script:
    - apk add --no-cache bash git jq
  script:
    - bash scripts/deploy-smoke.sh
  allow_failure: false
  timeout: 30m
  artifacts:
    when: always
    paths:
      - tmp/deploy-smoke/
    expire_in: 1 day
  rules:
    - if: >-
        ($CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop") ||
        ($CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BRANCH == "develop")
      changes:
        - backend/**/*
        - .gitlab-ci.yml
        - docker-compose.yml
        - infra/gitlab/**/*
        - infra/nginx/**/*
        - infra/docker/smoke.override.yml
        - scripts/deploy-smoke.sh
        - scripts/smoke-base.sh
        - scripts/deploy-dev-service.sh
    - when: never
