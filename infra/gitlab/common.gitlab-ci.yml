workflow:
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
    - if: >-
        $CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BRANCH == "develop"
    - when: never

stages:
  - lint
  - test
  - build
  - docker-build
  - deploy-dev

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  DEV_DEPLOY_WAIT_TIMEOUT: "120"

.gradle-job:
  image: eclipse-temurin:21-jdk-alpine
  cache:
    key: "gradle-$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
  before_script:
    - cd backend
    - chmod +x gradlew
  script:
    - ./gradlew "$GRADLE_TASK" --build-cache --no-daemon

.ssh-dev-job:
  before_script:
    - apk add --no-cache openssh-client
    - test -n "$DEV_DEPLOY_HOST"
    - test -n "$DEV_DEPLOY_USER"
    - test -n "$DEV_DEPLOY_PATH"
    - test -f "$DEV_SSH_PRIVATE_KEY"
    - test -f "$DEV_SSH_KNOWN_HOSTS"
    - install -d -m 700 "$CI_PROJECT_DIR/.ssh"
    - cp "$DEV_SSH_KNOWN_HOSTS" "$CI_PROJECT_DIR/.ssh/known_hosts"
    - chmod 600 "$CI_PROJECT_DIR/.ssh/known_hosts"
    - chmod 400 "$DEV_SSH_PRIVATE_KEY"

.docker-build-job:
  extends: .ssh-dev-job
  image: docker:28-cli
  services:
    - name: docker:28-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - set -o pipefail
    - docker info
    - docker build --file "$DOCKERFILE" --tag "$CONTAINER_IMAGE" backend
    - >-
      docker save "$CONTAINER_IMAGE" | gzip -1 |
      ssh -F /dev/null
      -i "$DEV_SSH_PRIVATE_KEY"
      -o UserKnownHostsFile="$CI_PROJECT_DIR/.ssh/known_hosts"
      -o StrictHostKeyChecking=yes
      "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST"
      "bash -o pipefail -c 'gunzip | docker load'"

  environment:
    name: development
    action: prepare

.deploy-dev-job:
  extends: .ssh-dev-job
  image: alpine:3.22
  script:
    - test -f docker-compose.yml
    - test -f infra/nginx/nginx.conf
    - test -f scripts/deploy-dev-service.sh
    - >-
      ssh -F /dev/null
      -i "$DEV_SSH_PRIVATE_KEY"
      -o UserKnownHostsFile="$CI_PROJECT_DIR/.ssh/known_hosts"
      -o StrictHostKeyChecking=yes
      "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST"
      "mkdir -p
      '$DEV_DEPLOY_PATH/infra/nginx'
      '$DEV_DEPLOY_PATH/scripts'"
    - >-
      scp -F /dev/null
      -i "$DEV_SSH_PRIVATE_KEY"
      -o UserKnownHostsFile="$CI_PROJECT_DIR/.ssh/known_hosts"
      -o StrictHostKeyChecking=yes
      docker-compose.yml
      "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST:$DEV_DEPLOY_PATH/docker-compose.yml"
    - >-
      scp -F /dev/null
      -i "$DEV_SSH_PRIVATE_KEY"
      -o UserKnownHostsFile="$CI_PROJECT_DIR/.ssh/known_hosts"
      -o StrictHostKeyChecking=yes
      infra/nginx/nginx.conf
      "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST:$DEV_DEPLOY_PATH/infra/nginx/nginx.conf"
    - >-
      scp -F /dev/null
      -i "$DEV_SSH_PRIVATE_KEY"
      -o UserKnownHostsFile="$CI_PROJECT_DIR/.ssh/known_hosts"
      -o StrictHostKeyChecking=yes
      scripts/deploy-dev-service.sh
      "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST:$DEV_DEPLOY_PATH/scripts/deploy-dev-service.sh"
    - >-
      ssh -F /dev/null
      -i "$DEV_SSH_PRIVATE_KEY"
      -o UserKnownHostsFile="$CI_PROJECT_DIR/.ssh/known_hosts"
      -o StrictHostKeyChecking=yes
      "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST"
      "cd '$DEV_DEPLOY_PATH' &&
      chmod 700 scripts/deploy-dev-service.sh &&
      ./scripts/deploy-dev-service.sh
      '$COMPOSE_SERVICE'
      '$DEPLOY_IMAGE_VARIABLE'
      '$CONTAINER_IMAGE'
      'docker-compose.yml'
      '$DEV_DEPLOY_WAIT_TIMEOUT'"
  environment:
    name: development

repository-lint:
  image: alpine:3.22
  stage: lint
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
    - git config core.whitespace "blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git diff --check "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA"
      else
        git show --check --format= "$CI_COMMIT_SHA"
      fi
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
    - if: >-
        $CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BRANCH == "develop"
    - when: never

backend-lint:
  extends: .gradle-job
  stage: lint
  script:
    - ./gradlew checkstyleMain checkstyleTest --build-cache --no-daemon
  rules:
    - if: >-
        ($CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop") ||
        ($CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BRANCH == "develop")
      changes:
        - backend/**/*
    - when: never
