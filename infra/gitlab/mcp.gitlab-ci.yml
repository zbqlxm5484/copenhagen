.mcp-verify-rules:
  rules:
    - if: >-
        ($CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop") ||
        ($CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BRANCH == "develop")
      changes:
        - backend/apps/mcp-server/**/*
        - backend/libs/internal-api-contract/**/*
        - backend/libs/test-support/**/*
        - backend/build.gradle
        - backend/settings.gradle
        - backend/gradle/**/*
        - backend/gradlew
        - backend/gradlew.bat
        - .gitlab-ci.yml
        - docker-compose.yml
        - scripts/deploy-dev-service.sh
        - infra/gitlab/common.gitlab-ci.yml
        - infra/gitlab/mcp.gitlab-ci.yml
    - when: never

.mcp-delivery-rules:
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "push" &&
        $CI_COMMIT_BRANCH == "develop"
      changes:
        - backend/apps/mcp-server/**/*
        - backend/libs/internal-api-contract/**/*
        - backend/libs/test-support/**/*
        - backend/build.gradle
        - backend/settings.gradle
        - backend/gradle/**/*
        - backend/gradlew
        - backend/gradlew.bat
        - .gitlab-ci.yml
        - docker-compose.yml
        - scripts/deploy-dev-service.sh
        - infra/gitlab/common.gitlab-ci.yml
        - infra/gitlab/mcp.gitlab-ci.yml
    - when: never

mcp-test:
  extends:
    - .gradle-job
    - .mcp-verify-rules
  stage: test
  variables:
    GRADLE_TASK: :apps:mcp-server:test

mcp-build:
  extends:
    - .gradle-job
    - .mcp-verify-rules
  stage: build
  needs:
    - mcp-test
  variables:
    GRADLE_TASK: :apps:mcp-server:bootJar
  artifacts:
    paths:
      - backend/apps/mcp-server/build/libs/app.jar
    expire_in: 1 day

mcp-docker-build:
  extends:
    - .docker-build-job
    - .mcp-delivery-rules
  stage: docker-build
  needs:
    - job: mcp-build
      artifacts: false
  variables:
    DOCKERFILE: backend/apps/mcp-server/Dockerfile
    CONTAINER_IMAGE: agentic-commerce/mcp-server:$CI_COMMIT_SHA
    IMAGE_ARCHIVE: docker-images/mcp-server.tar.gz

mcp-deploy-dev:
  extends:
    - .deploy-dev-job
    - .mcp-delivery-rules
  stage: deploy-dev
  needs:
    - job: mcp-docker-build
      artifacts: true
  resource_group: development-ec2
  variables:
    COMPOSE_SERVICE: mcp-server
    DEPLOY_IMAGE_VARIABLE: MCP_IMAGE
    CONTAINER_IMAGE: agentic-commerce/mcp-server:$CI_COMMIT_SHA
    IMAGE_ARCHIVE: docker-images/mcp-server.tar.gz
