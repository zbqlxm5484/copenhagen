name: copenhagen

services:
  nginx:
    image: docker.io/library/nginx:1.28-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on:
      core-service:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      pay-service:
        condition: service_healthy
    restart: unless-stopped

  core-service:
    image: ${CORE_IMAGE:-copenhagen/core-service:local}
    build:
      context: ./backend
      dockerfile: apps/core-service/Dockerfile
    environment:
      CORE_DB_URL: jdbc:postgresql://core-db:5432/core-db
      CORE_DB_USER: ${CORE_DB_USER:-core}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:-core-dev-password}
      # 개인정보 암호화 키. 아래 기본값은 CORE_DB_PASSWORD와 같은 성격의 개발 전용 값이다.
      # 운영 배포에서는 반드시 환경변수로 덮어써야 하며, 값이 없으면 core-service가 기동에 실패한다.
      CORE_PII_ENC_KEY: ${CORE_PII_ENC_KEY:-ZGV2LW9ubHktY29yZS1waWkta2V5LTMyLWJ5dGVzISE=}
      CORE_PII_HASH_PEPPER: ${CORE_PII_HASH_PEPPER:-dev-only-core-pii-hash-pepper-value-do-not-use-in-prod}
      PAY_SERVICE_URL: http://pay-service:8080
      MERCHANT_SERVICE_URL: http://ucp-merchant-mock:8080
    depends_on:
      core-db:
        condition: service_healthy
      pay-service:
        condition: service_healthy
      ucp-merchant-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mcp-server:
    image: ${MCP_IMAGE:-copenhagen/mcp-server:local}
    build:
      context: ./backend
      dockerfile: apps/mcp-server/Dockerfile
    environment:
      CORE_SERVICE_URL: http://core-service:8080
    depends_on:
      core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  pay-service:
    image: ${PAY_IMAGE:-copenhagen/pay-service:local}
    build:
      context: ./backend
      dockerfile: apps/pay-service/Dockerfile
    environment:
      PAY_DB_URL: jdbc:postgresql://pay-db:5432/pay-db
      PAY_DB_USER: ${PAY_DB_USER:-pay}
      PAY_DB_PASSWORD: ${PAY_DB_PASSWORD:-pay-dev-password}
      PG_SERVICE_URL: http://pg-mock:8080
      PAY_AUTH_USER_TOKENS_JSON: ${PAY_AUTH_USER_TOKENS_JSON:-}
      PAY_AUTH_CORE_SERVICE_TOKENS_JSON: ${PAY_AUTH_CORE_SERVICE_TOKENS_JSON:-}
      PAY_AUTH_MERCHANT_SERVICE_TOKENS_JSON: ${PAY_AUTH_MERCHANT_SERVICE_TOKENS_JSON:-}
      PAY_AUTH_JWT_ENABLED: ${PAY_AUTH_JWT_ENABLED:-false}
      PAY_AUTH_JWT_ISSUER: ${PAY_AUTH_JWT_ISSUER:-}
      PAY_AUTH_JWT_AUDIENCE: ${PAY_AUTH_JWT_AUDIENCE:-pay-service}
      PAY_AUTH_JWT_JWK_SET_JSON: ${PAY_AUTH_JWT_JWK_SET_JSON:-}
      PAY_AUTH_JWT_CLOCK_SKEW_SECONDS: ${PAY_AUTH_JWT_CLOCK_SKEW_SECONDS:-60}
      PAY_RECONCILIATION_ENABLED: ${PAY_RECONCILIATION_ENABLED:-true}
      PAY_RECONCILIATION_POLL_MILLIS: ${PAY_RECONCILIATION_POLL_MILLIS:-5000}
      PAY_RECONCILIATION_BATCH_SIZE: ${PAY_RECONCILIATION_BATCH_SIZE:-10}
      PAY_RECONCILIATION_LEASE_SECONDS: ${PAY_RECONCILIATION_LEASE_SECONDS:-60}
      PAY_RECONCILIATION_RETRY_SECONDS: ${PAY_RECONCILIATION_RETRY_SECONDS:-60}
    depends_on:
      pay-db:
        condition: service_healthy
      pg-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # 가상 몰 셋. 같은 이미지를 환경변수만 다르게 셋 띄운다(ucp-merchant-mock DESIGN.md 5.7절, ADR 0007).
  # 세 몰이 원본 상품 1,408건 풀을 나눠 갖고 같은 상품이 몰마다 다른 가격이라 가격 비교 시연이 된다.
  # b·c 는 profile "malls" 뒤에 있다. `docker compose --profile malls up -d` 로 켠다. 기본 up 과 CI 스모크는
  # a 하나만 띄운다 — Core 는 지금 merchant-a 하나만 등록돼 있고(MERCHANT_SERVICE_URL) b·c 를 Core
  # services.merchants[] 와 Pay 토큰 JSON·merchant_accounts 에 등록하는 것은 각 담당의 일이라, 등록 전에는
  # 떠 있어도 검색에 잡히지 않는다.
  ucp-merchant-mock:
    image: ${MERCHANT_MOCK_IMAGE:-copenhagen/ucp-merchant-mock:local}
    build:
      context: ./backend
      dockerfile: mocks/ucp-merchant-mock/Dockerfile
    environment:
      MERCHANT_DB_URL: jdbc:postgresql://merchant-db:5432/merchant-db
      MERCHANT_DB_USER: ${MERCHANT_DB_USER:-merchant}
      MERCHANT_DB_PASSWORD: ${MERCHANT_DB_PASSWORD:-merchant-dev-password}
      PAY_SERVICE_URL: http://pay-service:8080
      # 이 컨테이너가 흉내 내는 외부 사업자. id·상호·시드 파일·서명키 kid 넷이 한 몰이다.
      MERCHANT_ID: merchant-a
      MERCHANT_SELLER_NAME: ${MERCHANT_SELLER_NAME:-한강마켓}
      MERCHANT_PUBLIC_BASE_URL: http://ucp-merchant-mock:8080
      MERCHANT_SIGNING_KID: merchant-a-es256-1
      # 시연 카탈로그 약 1,100건. 비우면 V3 시드 5건만 뜬다.
      MERCHANT_CATALOG_SEED_FILE: ${MERCHANT_CATALOG_SEED_FILE:-classpath:catalog/merchant-a.json}
    depends_on:
      merchant-db:
        condition: service_healthy
      pay-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ucp-merchant-mock-b:
    profiles: ["malls"]
    image: ${MERCHANT_MOCK_IMAGE:-copenhagen/ucp-merchant-mock:local}
    build:
      context: ./backend
      dockerfile: mocks/ucp-merchant-mock/Dockerfile
    environment:
      MERCHANT_DB_URL: jdbc:postgresql://merchant-db:5432/merchant-db-b
      MERCHANT_DB_USER: ${MERCHANT_DB_USER:-merchant}
      MERCHANT_DB_PASSWORD: ${MERCHANT_DB_PASSWORD:-merchant-dev-password}
      PAY_SERVICE_URL: http://pay-service:8080
      MERCHANT_ID: merchant-b
      MERCHANT_SELLER_NAME: 노을상점
      MERCHANT_PUBLIC_BASE_URL: http://ucp-merchant-mock-b:8080
      MERCHANT_SIGNING_KID: merchant-b-es256-1
      MERCHANT_CATALOG_SEED_FILE: classpath:catalog/merchant-b.json
    depends_on:
      merchant-db:
        condition: service_healthy
      pay-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ucp-merchant-mock-c:
    profiles: ["malls"]
    image: ${MERCHANT_MOCK_IMAGE:-copenhagen/ucp-merchant-mock:local}
    build:
      context: ./backend
      dockerfile: mocks/ucp-merchant-mock/Dockerfile
    environment:
      MERCHANT_DB_URL: jdbc:postgresql://merchant-db:5432/merchant-db-c
      MERCHANT_DB_USER: ${MERCHANT_DB_USER:-merchant}
      MERCHANT_DB_PASSWORD: ${MERCHANT_DB_PASSWORD:-merchant-dev-password}
      PAY_SERVICE_URL: http://pay-service:8080
      MERCHANT_ID: merchant-c
      MERCHANT_SELLER_NAME: 별빛몰
      MERCHANT_PUBLIC_BASE_URL: http://ucp-merchant-mock-c:8080
      MERCHANT_SIGNING_KID: merchant-c-es256-1
      MERCHANT_CATALOG_SEED_FILE: classpath:catalog/merchant-c.json
    depends_on:
      merchant-db:
        condition: service_healthy
      pay-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  pg-mock:
    image: ${PG_MOCK_IMAGE:-copenhagen/pg-mock:local}
    build:
      context: ./backend
      dockerfile: mocks/pg-mock/Dockerfile
    environment:
      PG_MOCK_OUTCOME: ${PG_MOCK_OUTCOME:-SUCCESS}
      PG_MOCK_LOOKUP_OUTCOME: ${PG_MOCK_LOOKUP_OUTCOME:-UNKNOWN}
      PG_MOCK_RESPONSE_DELAY_MILLIS: ${PG_MOCK_RESPONSE_DELAY_MILLIS:-0}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  core-db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: core-db
      POSTGRES_USER: ${CORE_DB_USER:-core}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-core-dev-password}
    volumes:
      - core-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  pay-db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: pay-db
      POSTGRES_USER: ${PAY_DB_USER:-pay}
      POSTGRES_PASSWORD: ${PAY_DB_PASSWORD:-pay-dev-password}
    volumes:
      - pay-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  merchant-db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: merchant-db
      POSTGRES_USER: ${MERCHANT_DB_USER:-merchant}
      POSTGRES_PASSWORD: ${MERCHANT_DB_PASSWORD:-merchant-dev-password}
    volumes:
      - merchant-db-data:/var/lib/postgresql/data
    configs:
      # 몰 b·c 의 데이터베이스. 볼륨이 비어 있을 때 한 번만 실행된다. bind mount 가 아니라 inline config 인 이유는
      # CI 스모크의 Docker daemon(dind)이 job 컨테이너의 파일 경로를 공유하지 않기 때문이다(infra/docker/smoke.override.yml).
      - source: merchant-db-init
        target: /docker-entrypoint-initdb.d/10-merchant-malls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

configs:
  merchant-db-init:
    content: |
      -- 가상 몰 b·c 의 데이터베이스(ucp-merchant-mock DESIGN.md 5.7절). a 는 POSTGRES_DB 의 merchant-db 를 쓴다.
      -- 이미 볼륨이 있으면 docker compose down -v 로 지운 뒤 다시 올려야 만들어진다.
      CREATE DATABASE "merchant-db-b" OWNER CURRENT_USER;
      CREATE DATABASE "merchant-db-c" OWNER CURRENT_USER;

volumes:
  core-db-data:
  pay-db-data:
  merchant-db-data:
  redis-data:
